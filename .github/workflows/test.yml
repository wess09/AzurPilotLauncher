name: Test AzurPilot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest, windows-11-arm]

    steps:
      # 日志脱敏：注册 URL 掩码清单（明文见 tools/ci/log-mask.txt；base64 藏在
      # 环境变量里，避免本步骤自身的日志先出现 URL）。掩码对本 job 之后的全部
      # 日志生效；修改清单后需重新 base64 并同步两个 workflow 的所有 job。
      - name: Register log masks
        shell: bash
        env:
          AZURPILOT_LOG_MASK_B64: ""
        run: |
          printf '%s' "$AZURPILOT_LOG_MASK_B64" | openssl base64 -d -A | while IFS= read -r value; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install launcher UI dependencies
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend ci 2>&1 | bash tools/ci/redact-urls.sh

      - name: Test launcher UI
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend test 2>&1 | bash tools/ci/redact-urls.sh

      - name: Build launcher UI
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | bash tools/ci/redact-urls.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test component packaging and stable.json merging
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Install Tauri dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
              libssl-dev libayatana-appindicator3-dev librsvg2-dev
          } 2>&1 | bash tools/ci/redact-urls.sh

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tests use build.rs placeholders for uv and mTLS; no release secrets needed.
      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Check embedded launcher assets
        run: cargo check --locked --all-targets --features custom-protocol

      # GitHub-hosted Windows runners run as administrators, as required by
      # the launcher manifest and protected Node.js installer directory tests.
      - name: Run tests
        run: cargo test --locked --all-targets

  worker:
    name: Validate Cloudflare Worker (static assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 日志脱敏：注册 URL 掩码清单（明文见 tools/ci/log-mask.txt；base64 藏在
      # 环境变量里，避免本步骤自身的日志先出现 URL）。掩码对本 job 之后的全部
      # 日志生效；修改清单后需重新 base64 并同步两个 workflow 的所有 job。
      - name: Register log masks
        shell: bash
        env:
          AZURPILOT_LOG_MASK_B64: ""
        run: |
          printf '%s' "$AZURPILOT_LOG_MASK_B64" | openssl base64 -d -A | while IFS= read -r value; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Release builds generate the real manifest; this throwaway one only
      # validates the Worker config. deploy.sh also rejects any `main` entry.
      - name: Prepare dummy manifest
        run: |
          mkdir -p cf-worker/public/updata
          printf '%s\n' '{"version":"0.0.0-ci","platforms":{"ci":{"url":"https://example.com","sha256":"0"}}}' > cf-worker/public/updata/stable.json

      - name: Validate static-only Worker config
        env:
          WRANGLER_VERSION: "4.151.1"
        run: bash cf-worker/deploy.sh --dry-run
