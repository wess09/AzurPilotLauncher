name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'wess09' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: AzurPilotLauncher
            os: win
            arch: x64
            filename: 'AzurPilot_Setup_*_x64.exe'
          - rid: AzurPilotLauncher
            os: win
            arch: arm64
            filename: 'AzurPilot_Setup_*_arm64.exe'
          - rid: AzurPilotLauncher
            os: macos
            arch: arm64
            filename: 'AP-macOS-arm64.tar.xz'
          - rid: AzurPilotLauncher
            os: linux
            arch: x64
            filename: 'AzurPilot-Linux-x86_64.tar.xz'
          - rid: AzurPilotLauncherUpdater
            os: win
            arch: x64
            filename: 'azurpilot-windows-x86_64-*.exe'
          - rid: AzurPilotLauncherUpdater
            os: win
            arch: arm64
            filename: 'azurpilot-windows-aarch64-*.exe'
          - rid: AzurPilotLauncherUpdater
            os: macos
            arch: arm64
            filename: 'azurpilot-darwin-aarch64-*'
          - rid: AzurPilotLauncherUpdater
            os: linux
            arch: x64
            filename: 'azurpilot-linux-x86_64-*'
    steps:
      - name: Register log masks
        shell: bash
        env:
          AZURPILOT_LOG_MASK_B64: ""
          MIRRORCHYAN_LOG_MASK_B64: ""
        run: |
          for masks in "$AZURPILOT_LOG_MASK_B64" "$MIRRORCHYAN_LOG_MASK_B64"; do
            printf '%s' "$masks" | openssl base64 -d -A | while IFS= read -r value; do
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            done
          done
          echo "::add-mask::$GITHUB_REPOSITORY"
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ${{ matrix.rid }}
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: wess09
          repo: AzurPilotLauncher
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
